<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Alzheimer Care</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="navbar.css">
    <style>
        .floating-hearts {
            animation: heartFloat 6s infinite ease-in-out !important;
        }
        @keyframes heartFloat {
            0%, 100% { transform: translateY(100vh); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-100px); opacity: 0; }
        }
        
        .register-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 70vh;
            padding: 20px;
        }
        
        .register-form {
            background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(240,255,240,0.9));
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(40, 167, 69, 0.3), 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
            animation: formSlideIn 1s ease-out;
            border: 3px solid rgba(40, 167, 69, 0.3);
        }
        
        @keyframes formSlideIn {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .register-form h2 {
            color: #28a745;
            margin-bottom: 30px;
            font-size: 2.2rem;
            text-shadow: 0 2px 4px rgba(40, 167, 69, 0.3);
        }
        
        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
            font-size: 1.1rem;
        }
        
        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        
        .form-group input:focus {
            border-color: #28a745;
            outline: none;
            box-shadow: 0 0 15px rgba(40, 167, 69, 0.4);
            transform: scale(1.02);
        }
        
        .register-btn {
            background: linear-gradient(45deg, #28a745, #20c997);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 25px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            width: 100%;
        }
        
        .register-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(40, 167, 69, 0.4);
        }
        
        .register-icon {
            font-size: 4rem;
            color: #28a745;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="floating-hearts">💜</div>
    <div class="floating-hearts">❤️</div>
    <div class="floating-hearts">💙</div>
    <div class="floating-hearts">💚</div>
    <div class="floating-hearts">💛</div>

    <header>
        <div class="navbar">
            <ol><li>
            <a href="welcom.html">Home</a>
            <a href="aboutus.html">About Us</a>
            <a href="Symptoms.html">Symptoms</a>
            <a href="diet.html">Diet</a>
            <a href="Game.html">Game</a></li>
            <a href="login.jsp">Login</a>
            </li></ol>
        </div>
    </header>

    <main>
        <div class="register-container">
            <div class="register-form">
                <div class="register-icon">👤</div>
                <h2>Create Account</h2>
                
                <form action="register" method="post">
                    <div class="form-group">
                        <label for="username">Username:</label>
                        <input type="text" id="username" name="username" placeholder="Choose a username" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" placeholder="Create a password" required>
                    </div>
                    
                    <button type="submit" class="register-btn">Create Account</button>
                </form>
                
                <div style="margin-top: 20px; padding-top: 20px; border-top: 2px solid rgba(40, 167, 69, 0.2);">
                    <p style="color: #666; margin-bottom: 15px;">Already have an account?</p>
                    <a href="login.jsp" style="display: inline-block; padding: 12px 30px; background: linear-gradient(45deg, #af21da, #c329e2); color: white; text-decoration: none; border-radius: 25px; font-weight: bold;">Sign In</a>
                </div>
            </div>
        </div>
    </main>
    
    <footer>"COLLECT BEAUTIFUL MOMENTS AND LET THEM TELL THE STORY OF YOUR LIFE"</footer>
</body>
</html>
